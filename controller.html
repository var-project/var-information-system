<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <title>VAR Information System - Controller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #111827;
      --card: #1F2937;
      --card-strong: #374151;
      --text: #F9FAFB;
      --muted: #D1D5DB;
      --line: rgba(249, 250, 251, 0.14);
      --accent: #16A34A;
      --danger: #DC2626;
      --button-bg: linear-gradient(180deg, #374151, #273142);
      --danger-bg: linear-gradient(180deg, #DC2626, #991B1B);
      --page-bg:
        linear-gradient(180deg, rgba(17, 24, 39, 0.98), rgba(31, 41, 55, 0.96));
      --topbar-bg: rgba(17, 24, 39, 0.96);
      --shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
      --radius: 8px;
    }

    body[data-theme="light"] {
      --bg: #F3F4F6;
      --card: #FFFFFF;
      --card-strong: #E5E7EB;
      --text: #1F2937;
      --muted: #4B5563;
      --line: rgba(31, 41, 55, 0.14);
      --button-bg: linear-gradient(180deg, #FFFFFF, #F3F4F6);
      --danger-bg: linear-gradient(180deg, #EF4444, #B91C1C);
      --page-bg:
        linear-gradient(180deg, rgba(243, 244, 246, 0.99), rgba(229, 231, 235, 0.96));
      --topbar-bg: rgba(255, 255, 255, 0.94);
      --shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
    }

    body[data-theme="light"] .status-code,
    body[data-theme="light"] .custom-input,
    body[data-theme="light"] .settings-input {
      background: #F8FAFC;
    }

    body[data-theme="light"] .setting-section,
    body[data-theme="light"] .history-item {
      background: rgba(226, 232, 240, 0.72);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Roboto", "Open Sans", Arial, Helvetica, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: var(--page-bg);
      color: var(--text);
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
      background: var(--topbar-bg);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }

    .topbar-inner {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(260px, auto) minmax(260px, 0.9fr);
      gap: 12px;
      align-items: center;
      max-width: 1560px;
      margin: 0 auto;
    }

    .brand {
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.1;
      letter-spacing: 0;
      font-weight: 800;
    }

    .brand p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .status-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .match-strip {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    .match-input,
    .viewer-open-button {
      min-height: 42px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.88);
      color: var(--text);
      font-size: 12px;
      font-weight: 900;
    }

    .match-input {
      width: 132px;
      outline: none;
      text-align: center;
    }

    .match-input:focus {
      border-color: rgba(34, 197, 94, 0.72);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.16);
    }

    .viewer-open-button {
      min-width: 124px;
      border-color: rgba(34, 197, 94, 0.42);
      background: linear-gradient(180deg, #22C55E, #15803D);
      color: #052E16;
      cursor: pointer;
      transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
    }

    .viewer-open-button:active {
      transform: scale(0.96);
    }

    .pill {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.88);
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 999px;
      background: #64748B;
      box-shadow: 0 0 0 4px rgba(100, 116, 139, 0.18);
      flex: 0 0 auto;
    }

    .dot.online {
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2), 0 0 18px rgba(34, 197, 94, 0.55);
    }

    .dot.offline {
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2), 0 0 18px rgba(239, 68, 68, 0.45);
    }

    main {
      width: min(1560px, 100%);
      margin: 0 auto;
      padding: 12px 14px calc(18px + env(safe-area-inset-bottom));
    }

    .operation-grid {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 12px;
      align-items: start;
    }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .category-card,
    .side-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .category-card {
      overflow: hidden;
      border-top: 4px solid var(--category-color, var(--accent));
    }

    .category-header {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
    }

    .category-header h2,
    .side-card h2 {
      margin: 0;
      font-size: 13px;
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .category-header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .button-list {
      display: grid;
      gap: 6px;
      padding: 9px;
    }

    .status-button,
    .send-custom,
    .clear-button {
      width: 100%;
      min-height: 54px;
      border: 1px solid rgba(248, 250, 252, 0.16);
      border-radius: var(--radius);
      color: var(--text);
      background: var(--button-bg);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 12px 22px rgba(0, 0, 0, 0.22);
      cursor: pointer;
      transition: transform 150ms ease, box-shadow 150ms ease, border-color 150ms ease, background 150ms ease;
    }

    .status-button {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 8px;
      align-items: center;
      padding: 8px;
      text-align: left;
    }

    .status-button:active,
    .status-button.is-pressed,
    .send-custom:active,
    .clear-button:active {
      transform: scale(0.975);
      border-color: var(--category-color, var(--accent));
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.24), 0 0 26px rgba(34, 197, 94, 0.35);
    }

    .status-code {
      min-height: 36px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.78);
      color: var(--category-color, var(--accent));
      font-size: 15px;
      font-weight: 900;
    }

    .status-text {
      font-size: 12px;
      line-height: 1.25;
      font-weight: 800;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .side-column {
      position: sticky;
      top: calc(78px + env(safe-area-inset-top));
      display: grid;
      gap: 10px;
    }

    .side-card {
      padding: 10px;
    }

    .mini-viewer-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      margin-top: 8px;
      border: 1px solid rgba(248, 250, 252, 0.16);
      border-radius: 8px;
      background: #000;
      overflow: hidden;
    }

    .mini-viewer-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    .side-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .side-actions #settingsButton {
      grid-column: 1 / -1;
    }

    .panel-action-button {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--button-bg);
      color: var(--text);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 150ms ease, border-color 150ms ease;
    }

    .panel-action-button:active {
      transform: scale(0.975);
      border-color: var(--accent);
    }

    .last-panel {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .last-big {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: center;
    }

    .last-code {
      width: 58px;
      min-height: 50px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      background: var(--card-strong);
      font-size: 20px;
      font-weight: 900;
    }

    .last-message {
      margin: 0;
      font-size: 14px;
      line-height: 1.25;
      font-weight: 900;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .last-meta {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .color-indicator {
      width: 48px;
      height: 22px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      background: #111827;
    }

    .clear-button {
      min-height: 52px;
      margin-top: 8px;
      background: var(--danger-bg);
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .viewer-mode {
      display: grid;
      gap: 10px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .viewer-mode-label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .viewer-mode-toggle {
      width: 100%;
      min-height: 74px;
      border: 1px solid rgba(34, 197, 94, 0.42);
      border-radius: var(--radius);
      background: linear-gradient(180deg, #22C55E, #15803D);
      color: #052E16;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 12px 22px rgba(0, 0, 0, 0.22);
      cursor: pointer;
      font-size: 17px;
      font-weight: 900;
      transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
    }

    .viewer-mode-toggle.is-hidden {
      border-color: rgba(148, 163, 184, 0.44);
      background: linear-gradient(180deg, #475569, #334155);
      color: var(--text);
    }

    .viewer-mode-toggle:active {
      transform: scale(0.975);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2), 0 0 26px rgba(34, 197, 94, 0.28);
    }

    .custom-form {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 10px;
      margin-top: 10px;
    }

    .custom-input {
      width: 100%;
      min-height: 56px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0 16px;
      background: rgba(15, 23, 42, 0.72);
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      outline: none;
    }

    .settings-input {
      width: 100%;
      min-height: 54px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0 14px;
      background: rgba(15, 23, 42, 0.72);
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
      outline: none;
    }

    .settings-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.18);
    }

    .link-grid {
      display: grid;
      gap: 8px;
    }

    .match-link {
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.35;
      overflow-wrap: anywhere;
      text-decoration-color: rgba(34, 197, 94, 0.72);
    }

    .custom-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.18);
    }

    .send-custom {
      min-height: 56px;
      background: linear-gradient(180deg, #22C55E, #15803D);
      color: #052E16;
      font-size: 15px;
      font-weight: 900;
    }

    .history-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
      max-height: min(58vh, 520px);
      overflow: auto;
      padding-right: 2px;
    }

    .history-item {
      display: grid;
      grid-template-columns: 74px 58px 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.46);
      font-size: 13px;
      font-weight: 800;
    }

    .history-time,
    .history-message {
      color: var(--muted);
    }

    .history-message {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .toast {
      position: fixed;
      right: calc(18px + env(safe-area-inset-right));
      bottom: calc(18px + env(safe-area-inset-bottom));
      z-index: 100;
      min-width: 220px;
      padding: 16px 18px;
      border: 1px solid rgba(34, 197, 94, 0.5);
      border-radius: var(--radius);
      background: rgba(21, 128, 61, 0.96);
      color: #F0FDF4;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.38), 0 0 30px rgba(34, 197, 94, 0.32);
      font-size: 16px;
      font-weight: 900;
      text-align: center;
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1199px) {
      .topbar-inner {
        grid-template-columns: 1fr;
        align-items: stretch;
      }

      .status-strip {
        justify-content: flex-start;
      }

      .operation-grid {
        grid-template-columns: 1fr;
      }

      .categories-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .side-column {
        position: static;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .last-sent-card {
        order: -1;
      }

      .mini-viewer-card {
        order: -2;
      }
    }

    @media (max-width: 767px) {
      .topbar {
        padding-left: 12px;
        padding-right: 12px;
      }

      .brand h1 {
        font-size: 21px;
      }

      .status-strip {
        display: grid;
        grid-template-columns: 1fr;
      }

      .match-strip {
        display: grid;
        grid-template-columns: 1fr;
      }

      .match-input,
      .viewer-open-button {
        width: 100%;
        min-width: 0;
        border-radius: var(--radius);
      }

      .pill {
        justify-content: center;
        border-radius: var(--radius);
      }

      main {
        padding: 14px 12px calc(28px + env(safe-area-inset-bottom));
      }

      .categories-grid,
      .side-column,
      .custom-form {
        grid-template-columns: 1fr;
      }

      .category-header,
      .button-list,
      .side-card {
        padding: 14px;
      }

      .status-button {
        min-height: 88px;
        grid-template-columns: 52px 1fr;
        padding: 12px;
      }

      .status-text {
        font-size: 16px;
      }

      .history-item {
        grid-template-columns: 66px 48px 1fr;
        gap: 8px;
      }

      .toast {
        left: calc(12px + env(safe-area-inset-left));
        right: calc(12px + env(safe-area-inset-right));
        bottom: calc(14px + env(safe-area-inset-bottom));
      }
    }

    @media (orientation: landscape) and (max-width: 900px) {
      .topbar-inner {
        grid-template-columns: 1fr 1fr;
      }

      .status-button {
        min-height: 80px;
      }
    }

    .app-content {
      display: none;
    }

    .app-content.authenticated {
      display: block;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 150;
      display: grid;
      place-items: center;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: min(520px, 92vw);
      max-height: min(85vh, 700px);
      overflow: auto;
      display: grid;
      gap: 14px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .modal-card.is-wide {
      width: min(760px, 94vw);
    }

    .modal-card h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .setting-section {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(15, 23, 42, 0.18);
    }

    .setting-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .settings-toggle {
      width: 100%;
      min-height: 50px;
      border: 1px solid rgba(34, 197, 94, 0.42);
      border-radius: var(--radius);
      background: linear-gradient(180deg, #22C55E, #15803D);
      color: #052E16;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 150ms ease, background 150ms ease;
    }

    .settings-toggle.is-hidden {
      border-color: rgba(148, 163, 184, 0.44);
      background: linear-gradient(180deg, #475569, #334155);
      color: var(--text);
    }

    .settings-toggle:active {
      transform: scale(0.975);
    }

    .close-modal-btn {
      width: 100%;
      min-height: 50px;
      border: 1px solid rgba(148, 163, 184, 0.44);
      border-radius: var(--radius);
      background: linear-gradient(180deg, #475569, #334155);
      color: var(--text);
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 150ms ease;
    }

    .close-modal-btn:active {
      transform: scale(0.975);
    }

    .logout-btn {
      width: 100%;
      min-height: 50px;
      border: 1px solid rgba(239, 68, 68, 0.44);
      border-radius: var(--radius);
      background: var(--danger-bg);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 150ms ease;
    }

    .logout-btn:active {
      transform: scale(0.975);
    }

  </style>
</head>
<body data-page="controller">
  <div id="appContent" class="app-content">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>VAR Information System</h1>
        <p id="controllerSubtitle">Controller</p>
      </div>

      <div id="matchStrip" class="match-strip" aria-label="Match selector"></div>

      <div class="status-strip" aria-live="polite">
        <div class="pill"><span id="connectionDot" class="dot online"></span><span id="connectionStatus">Local File Mode</span></div>
        <div class="pill"><span id="currentDateTime">--</span></div>
      </div>
    </div>
  </header>

  <main>
    <div class="operation-grid">
      <section>
        <div id="categoriesGrid" class="categories-grid" aria-label="VAR status categories"></div>
      </section>

      <aside class="side-column">
        <section class="side-card mini-viewer-card" aria-labelledby="miniViewerTitle">
          <h2 id="miniViewerTitle">Mini Viewer</h2>
          <div class="mini-viewer-frame">
            <iframe id="miniViewerFrame" title="Current match viewer preview" src="viewer.html?match=1"></iframe>
          </div>
        </section>

        <section class="side-card last-sent-card" aria-labelledby="lastSentTitle">
          <h2 id="lastSentTitle">Last Sent</h2>
          <div class="last-panel">
            <div class="last-big">
              <div id="lastCode" class="last-code">--</div>
              <p id="lastMessage" class="last-message">No status sent</p>
            </div>
            <div class="last-meta">
              <span id="lastTime">--:--:--</span>
              <span id="lastColor" class="color-indicator" aria-label="Color indicator"></span>
            </div>
          </div>

          <button id="clearButton" class="clear-button" type="button">CLEAR</button>

          <div class="side-actions">
            <button id="openCustomModal" class="panel-action-button" type="button">CUSTOM</button>
            <button id="openHistoryModal" class="panel-action-button" type="button">HISTORY</button>
            <button id="settingsButton" class="panel-action-button" type="button" aria-label="Settings">SETTINGS</button>
          </div>
        </section>
      </aside>
    </div>
  </main>

  <div id="settingsModal" class="modal-overlay">
    <div class="modal-card">
      <h2>Settings</h2>

      <div class="setting-section">
        <div class="setting-label">Controller Theme</div>
        <select id="settingsThemeSelect" class="settings-input">
          <option value="system">System Default</option>
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </div>

      <div class="setting-section">
        <div class="setting-label">Viewer Message</div>
        <button id="settingsMessageToggle" class="settings-toggle" type="button" aria-pressed="true">HIDE MESSAGE</button>
      </div>

      <div class="setting-section">
        <div class="setting-label">Code Image Format</div>
        <select id="settingsImageFormatSelect" class="settings-input">
          <option value="png">PNG</option>
          <option value="jpg">JPG</option>
        </select>
      </div>

      <div class="setting-section">
        <div class="setting-label">Match Background</div>
        <input id="settingsBackgroundInput" class="settings-input" type="text" placeholder="bg.png" autocomplete="off">
      </div>

      <div class="setting-section">
        <div class="setting-label">Match Links</div>
        <div class="link-grid">
          <a id="controllerMatchLink" class="match-link" href="controller.html">Controller</a>
          <a id="viewerMatchLink" class="match-link" href="viewer.html">Viewer</a>
        </div>
      </div>

      <button id="logoutButton" class="logout-btn" type="button">LOGOUT</button>
      <button id="closeSettings" class="close-modal-btn" type="button">CLOSE</button>
    </div>
  </div>

  <div id="customModal" class="modal-overlay">
    <div class="modal-card">
      <h2 id="customTitle">Custom Message</h2>
      <div class="custom-form">
        <input id="customMessage" class="custom-input" type="text" placeholder="Enter custom message..." autocomplete="off">
        <button id="sendCustom" class="send-custom" type="button">SEND</button>
      </div>
      <button id="closeCustomModal" class="close-modal-btn" type="button">CLOSE</button>
    </div>
  </div>

  <div id="historyModal" class="modal-overlay">
    <div class="modal-card is-wide">
      <h2 id="historyTitle">History</h2>
      <div id="historyList" class="history-list" aria-live="polite"></div>
      <button id="closeHistoryModal" class="close-modal-btn" type="button">CLOSE</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite">Viewer Updated</div>
