<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <title>VAR Information System - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111827;
      --card: #1F2937;
      --text: #F9FAFB;
      --muted: #D1D5DB;
      --line: rgba(249, 250, 251, 0.14);
      --accent: #16A34A;
      --danger: #DC2626;
      --shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
      --radius: 8px;
    }

    body[data-theme="light"] {
      --bg: #F3F4F6;
      --card: #FFFFFF;
      --text: #1F2937;
      --muted: #4B5563;
      --line: rgba(31, 41, 55, 0.14);
      --shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Roboto", "Open Sans", Arial, Helvetica, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: calc(24px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
      background:
        linear-gradient(180deg, rgba(15, 23, 42, 0.98), rgba(30, 41, 59, 0.96)),
        url("bg.png") center / cover no-repeat;
      color: var(--text);
    }

    body[data-theme="light"] {
      background:
        linear-gradient(180deg, rgba(243, 244, 246, 0.94), rgba(229, 231, 235, 0.94)),
        url("bg.png") center / cover no-repeat;
    }

    button,
    input {
      font: inherit;
    }

    .login-card {
      width: min(430px, 100%);
      display: grid;
      gap: 18px;
      padding: 34px 30px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .login-brand {
      text-align: center;
    }

    .login-brand h1 {
      margin: 0 0 6px;
      font-size: 26px;
      line-height: 1.15;
      font-weight: 900;
    }

    .login-brand p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .login-form {
      display: grid;
      gap: 12px;
    }

    .login-input {
      width: 100%;
      min-height: 56px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0 16px;
      background: rgba(15, 23, 42, 0.72);
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      outline: none;
    }

    body[data-theme="light"] .login-input {
      background: #F8FAFC;
    }

    .login-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.18);
    }

    .login-input.error {
      border-color: var(--danger);
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.18);
    }

    .login-button {
      width: 100%;
      min-height: 56px;
      border: 1px solid rgba(34, 197, 94, 0.42);
      border-radius: var(--radius);
      background: linear-gradient(180deg, #22C55E, #15803D);
      color: #052E16;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 150ms ease, opacity 150ms ease, box-shadow 150ms ease;
    }

    .login-button:disabled {
      cursor: wait;
      opacity: 0.72;
    }

    .login-button:active {
      transform: scale(0.975);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2), 0 0 26px rgba(34, 197, 94, 0.28);
    }

    .login-error {
      min-height: 20px;
      margin: 0;
      color: var(--danger);
      font-size: 14px;
      font-weight: 800;
      text-align: center;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 28px 22px;
      }

      .login-brand h1 {
        font-size: 23px;
      }
    }
  </style>
</head>
<body data-page="login">
  <main class="login-card" aria-labelledby="loginTitle">
    <div class="login-brand">
      <h1 id="loginTitle">VAR Information System</h1>
      <p>Controller Access</p>
    </div>

    <form id="loginForm" class="login-form">
      <input id="loginUsername" class="login-input" type="text" name="username" placeholder="Username" autocomplete="username" required>
      <input id="loginPassword" class="login-input" type="password" name="password" placeholder="Password" autocomplete="current-password" required>
      <button id="loginButton" class="login-button" type="submit">LOGIN</button>
      <p id="loginError" class="login-error" aria-live="polite"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
